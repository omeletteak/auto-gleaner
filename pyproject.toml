[project]
name = "privatter-fanbox-companion"
version = "0.0.1"
description = "PixivFanboxDownloader で保存した投稿の .txt から Privatter+ の原寸画像を一括保存するローカル CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pfc = "privatter_fanbox_companion.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privatter_fanbox_companion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]
# 日本語の全角文字を許可
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
# サプライチェーン対策: 公開から7日以上たった版だけを解決する（乗っ取り直後の悪性版を避ける）
exclude-newer = "7 days"
